name: model-only-tests
# Tests that the tool handles a configured model name without an API key —
# it must fall back gracefully to heuristic mode (no crash, no LLM calls).
# Only GEMINI_MODEL is set; GEMINI_API_KEY is intentionally left empty.
#
# One job, one trigger event (pull_request_target covers ALL pull requests,
# fork or not -- no separate pull_request trigger, so this doesn't fire
# twice per PR update):
#   - push, and same-repo pull requests: `environment` below evaluates to
#     an empty string (GitHub treats that as "no environment"), so the
#     variable resolves straight from the repo-level variable, no approval.
#   - pull_request_target from an actual fork: `environment` evaluates to
#     `gemini-ci-fork` instead. That Environment must have "Required
#     reviewers" configured (Settings > Environments) so a maintainer
#     explicitly approves each run before it executes against fork code.
#     (This job never has an API key regardless of trigger, so there's no
#     secret to leak here -- the reviewer gate is kept anyway for
#     consistency with the other two fork-aware workflows and because it
#     still runs arbitrary fork code.)
#
# pull_request_target always uses the workflow file from the base branch,
# not the PR's -- so changes to *this file* only take effect once merged.
# Its default checkout also targets the base branch, not the PR; the
# checkout step below sets `ref:` explicitly to actually test the PR.
#
# Required repository variable: vars.GEMINI_MODEL
# Required for fork PRs — Environment `gemini-ci-fork` with:
#   - Required reviewers protection rule
#   - environment variable: GEMINI_MODEL

on:
  push:
    branches: ["main"]
  pull_request_target:
    branches: ["main"]

permissions:
  contents: read

jobs:
  model-only-tests:
    name: model-only-tests
    if: ${{ !github.event.repository.fork }}
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'gemini-ci-fork' || '' }}
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # Intentionally empty: tests should run in heuristic mode without an API key.
      GEMINI_API_KEY: ""

    steps:
      - name: Validate environment
        run: |
          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::vars.GEMINI_MODEL is not set. Add it as a repository variable (or on the gemini-ci-fork environment for fork PRs)." >&2
            exit 1
          fi

      # Only reached after a maintainer approves the gemini-ci-fork
      # environment's required reviewer check, when that applies.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
