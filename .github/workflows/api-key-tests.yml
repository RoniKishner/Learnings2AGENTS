name: api-key-tests
# Tests LLM mode with auto-detected model (the chain probe in GeminiClient).
# Only GEMINI_API_KEY is set; GEMINI_MODEL is intentionally absent.
#
# Required repository secret: secrets.GEMINI_API_KEY

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-key-tests:
    name: api-key-tests
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
