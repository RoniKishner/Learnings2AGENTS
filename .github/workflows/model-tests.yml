name: model-tests
# Tests that the tool handles a configured model name without an API key —
# it must fall back gracefully to heuristic mode (no crash, no LLM calls).
# Only GEMINI_MODEL is set; GEMINI_API_KEY is intentionally absent.
#
# Required repository variable: vars.GEMINI_MODEL (falls back to gemini-3.6-flash)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  model-tests:
    name: model-tests
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
