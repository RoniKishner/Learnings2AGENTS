name: api-key-only-tests
# Tests LLM mode with auto-detected model (the chain probe in GeminiClient).
# Only GEMINI_API_KEY is set; GEMINI_MODEL is intentionally left empty.
#
# One job, one trigger event (pull_request_target covers ALL pull requests,
# fork or not -- no separate pull_request trigger, so this doesn't fire
# twice per PR update):
#   - push, and same-repo pull requests: `environment` below evaluates to
#     an empty string (GitHub treats that as "no environment"), so secrets
#     resolve straight from the repo-level secret, no approval.
#   - pull_request_target from an actual fork: `environment` evaluates to
#     `gemini-ci-fork` instead. That Environment must have "Required
#     reviewers" configured (Settings > Environments) so a maintainer
#     explicitly approves each run -- after reviewing the diff -- before
#     the fork's code gets access to the real key. Without that reviewer
#     gate, pull_request_target would hand the real key to unreviewed fork
#     code on first contact, which could exfiltrate it (e.g. a network
#     call from the test suite); GitHub's log secret-masking does not
#     protect against that, only against accidentally printing it.
#
# pull_request_target always uses the workflow file from the base branch,
# not the PR's -- so changes to *this file* only take effect once merged.
# Its default checkout also targets the base branch, not the PR; the
# checkout step below sets `ref:` explicitly to actually test the PR.
#
# Required repository secret:  secrets.GEMINI_API_KEY
# Required for fork PRs — Environment `gemini-ci-fork` with:
#   - Required reviewers protection rule
#   - environment secret: GEMINI_API_KEY (use a scoped/low-quota CI key,
#     not shared with anything else)

on:
  push:
    branches: ["main"]
  pull_request_target:
    branches: ["main"]

permissions:
  contents: read

jobs:
  api-key-only-tests:
    name: api-key-only-tests
    if: ${{ !github.event.repository.fork }}
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'gemini-ci-fork' || '' }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Intentionally empty: model should be auto-detected without this value.
      GEMINI_MODEL: ""

    steps:
      - name: Validate environment
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::secrets.GEMINI_API_KEY is not set. Add it as a repository secret (or on the gemini-ci-fork environment for fork PRs)." >&2
            exit 1
          fi

      # Only reached after a maintainer approves the gemini-ci-fork
      # environment's required reviewer check, when that applies.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
